# Multi-arch (amd64, arm64) builds of upstream images published for amd64
# only, pushed to ghcr.io/<owner>/<image>:<upstream tag>. Each Dockerfile
# clones the upstream tag and cross-compiles on the runner: no emulation.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: config-policy-controller, version: v0.18.0}
          - {image: config-policy-controller, version: v0.19.0}
          - {image: governance-policy-framework-addon, version: v0.18.0}
          - {image: governance-policy-framework-addon, version: v0.19.0}
          - {image: argocd-operator, version: v0.18.0}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ matrix.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
