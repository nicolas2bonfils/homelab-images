# Multi-arch (amd64, arm64) builds of upstream images published for amd64
# only, pushed to ghcr.io/<owner>/<image>:<upstream tag>. Each Dockerfile
# clones the upstream tag and cross-compiles on the runner: no emulation.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: config-policy-controller, version: v0.18.0}
          - {image: config-policy-controller, version: v0.19.0}
          - {image: governance-policy-framework-addon, version: v0.18.0}
          - {image: governance-policy-framework-addon, version: v0.19.0}
          - {image: argocd-operator, version: v0.18.0}
          - {image: argocd-pull-integration, version: v0.30.0}
          # autopush-rs: two crates, one Dockerfile in images/autopush.
          # amd64 only, the crates do not cross-compile cleanly.
          - {image: autopush-autoconnect, dir: autopush, version: dd3a32949b2d9695b131720f2bdcc491e155b91d, crate: autoconnect, binary: autoconnect, platforms: linux/amd64}
          - {image: autopush-autoendpoint, dir: autopush, version: dd3a32949b2d9695b131720f2bdcc491e155b91d, crate: autoendpoint, binary: autoendpoint, platforms: linux/amd64}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.dir || matrix.image }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            VERSION=${{ matrix.version }}
            CRATE=${{ matrix.crate }}
            BINARY=${{ matrix.binary }}
          # The Rust build is the long one: a cache hit turns 30 minutes
          # into about 8 on the next upstream bump.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
